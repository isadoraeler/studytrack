services:
  banco:
    image: postgres:16
    container_name: studytrack-banco
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - studytrack-rede

  web:
    build: .
    container_name: studytrack-web
    ports:
      - "5000:5000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: banco
      POSTGRES_PORT: 5432
    depends_on:
      - banco
    networks:
      - studytrack-rede

volumes:
  dados_postgres:

networks:
  studytrack-rede: